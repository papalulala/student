<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60318 - 綠色旅行・貓尾巴</title>
    <style>
        body {
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            background-color: #fcfcf9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            background: #ffffff;
            margin: 20px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 20px;
            }
        }
        .left-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .header-title {
            font-size: 48px;
            font-weight: bold;
            color: #2d5a27;
            margin: 0;
            letter-spacing: 2px;
        }
        .header-subtitle {
            font-size: 24px;
            color: #555;
            margin-top: 5px;
            margin-bottom: 30px;
            font-weight: 300;
        }
        .illustration-placeholder {
            background-color: #e5e5e5;
            border: 2px solid #ccc;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #777;
            font-size: 16px;
            text-align: center;
            border-radius: 4px;
            padding: 20px;
            box-sizing: border-box;
        }
        .right-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .qr-section {
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .qr-placeholder {
            width: 120px;
            height: 120px;
            background-color: #333;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .address {
            font-size: 13px;
            color: #666;
        }
        .brand-title {
            font-size: 56px;
            font-weight: 900;
            color: #111;
            margin: 20px 0;
            letter-spacing: 4px;
        }
        .description {
            font-size: 15px;
            line-height: 1.8;
            color: #444;
            text-align: justify;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 14px;
            color: #2d5a27;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div>
            <h1 class="header-title">綠色旅行</h1>
            <div class="header-subtitle">散步 / 腳踏車</div>
        </div>
        <div class="illustration-placeholder">
            【 店面與街景意象插圖區域 】
        </div>
    </div>
    
    <div class="right-panel">
        <div class="qr-section">
            <div style="display: flex; justify-content: center;">
                <div class="qr-placeholder">QR Code 行動條碼</div>
            </div>
            <div class="address">600嘉義市東區朝陽里民族路25號</div>
        </div>
        
        <h2 class="brand-title">貓尾巴</h2>
        
        <div class="description">
            貓尾巴麵包店以滿滿的用心與熱情，製作出香氣四溢、口感豐富的美味麵包。從經典人氣款到特色手作點心，每一份麵包都承載著對烘焙的堅持與對美味的講究。希望透過新鮮出爐的香甜滋味，為每位顧客帶來簡單而溫暖的幸福。不論是早餐、下午茶，還是日常的小小犒賞，都歡迎來到貓尾巴麵包店，讓麵包香陪伴你的每一天！
        </div>
        
        <div class="footer-note">
            網頁名稱：60318
        </div>
    </div>
</div>

</body>
</html>
