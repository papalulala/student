<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60310 - 綠色旅行 | 初八麵食</title>
    <style>
        :root {
            --primary-color: #8C6239;
            --bg-color: #FDFBF7;
            --text-color: #333333;
            --accent-color: #A84444;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header Styling */
        .header {
            padding: 40px;
            border-bottom: 1px solid #F0EAE1;
            background: linear-gradient(135deg, #FFFDF9 0%, #F7F2E8 100%);
        }

        .main-title {
            font-size: 2.5rem;
            color: var(--primary-color);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            letter-spacing: 4px;
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 40px;
            padding: 40px;
        }

        /* Left Side: Art Illustration */
        .illustration-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #FAF6EE;
            border-radius: 12px;
            padding: 30px;
            min-height: 380px;
            position: relative;
        }

        /* Pure CSS Illustration of the storefront */
        .storefront {
            width: 100%;
            max-width: 380px;
            height: 240px;
            position: relative;
            background-color: #E2DDD5; /* Ground/Base bg */
            border-radius: 8px;
            overflow: hidden;
        }

        .roof-top {
            width: 106%;
            height: 45px;
            background-color: #5C3D46; /* Deep brown-red roof */
            position: absolute;
            top: 25px;
            left: -3%;
            transform: rotate(-1deg);
            z-index: 5;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .roof-badge {
            width: 50px;
            height: 30px;
            background-color: #E38B75; /* Salmon pink shape on roof */
            position: absolute;
            top: 5px;
            right: 40px;
            clip-path: polygon(25% 0%, 100% 20%, 75% 100%, 0% 80%);
        }

        .awning {
            width: 100%;
            height: 20px;
            background-color: #2C2C2C; /* Dark black stripe under roof */
            position: absolute;
            top: 70px;
            z-index: 4;
        }

        .wall-left {
            width: 40%;
            height: 150px;
            background-color: #C2BAA8; /* Left beige wall */
            position: absolute;
            bottom: 0;
            left: 0;
            border-right: 4px solid #A8A090;
        }

        .window-left {
            width: 70px;
            height: 40px;
            background-color: #FFFFFF;
            position: absolute;
            top: 25px;
            left: 20px;
            border: 3px solid #8C8475;
            display: flex;
            gap: 4px;
            padding: 3px;
        }
        .window-pane {
            flex: 1;
            background-color: #EAEAEA;
        }

        .wall-center {
            width: 60%;
            height: 150px;
            background-color: #EAE5DC; /* Main storefront wall */
            position: absolute;
            bottom: 0;
            right: 0;
        }

        .tree-shadow {
            width: 35px;
            height: 90px;
            background-color: #A3967F; /* Greenish/brownish shadow shape */
            position: absolute;
            bottom: 10px;
            left: 43%;
            clip-path: polygon(50% 0%, 100% 40%, 70% 40%, 80% 100%, 20% 100%, 30% 40%, 0% 40%);
            opacity: 0.8;
        }

        .door-area {
            width: 90px;
            height: 100px;
            background-color: #D35B47; /* Reddish door section */
            position: absolute;
            bottom: 0;
            right: 50px;
            border: 2px solid #BC4E3A;
        }

        .door-window {
            width: 45px;
            height: 45px;
            background-color: #FFFFFF;
            position: absolute;
            top: 15px;
            left: 15px;
            border: 2px solid #555;
        }

        .right-shadow {
            width: 40px;
            height: 120px;
            background-color: #7C6E59; /* Right side abstract shape */
            position: absolute;
            bottom: 0;
            right: 0;
            clip-path: polygon(30% 0%, 100% 20%, 80% 100%, 0% 100%);
        }

        /* Right Side: Text & Info */
        .info-side {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-section {
            margin-bottom: 25px;
        }

        .brand-title {
            font-size: 3rem;
            color: #111111;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }

        .brand-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 60px;
            height: 4px;
            background-color: var(--accent-color);
        }

        .description {
            font-size: 1.05rem;
            color: #444444;
            text-align: justify;
            margin-bottom: 30px;
        }

        .address-box {
            display: flex;
            align-items: center;
            background-color: #F7F5F0;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 25px;
        }

        .qr-code {
            width: 65px;
            height: 65px;
            background-color: #222;
            margin-right: 15px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            padding: 5px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .qr-pixel {
            background-color: #FFF;
        }
        .qr-pixel:nth-child(3n+1), .qr-pixel:nth-child(7n+2) {
            background-color: #000;
        }

        .address-text {
            font-size: 0.95rem;
            color: #555;
            font-weight: 600;
        }

        /* Map Section */
        .map-container {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #EAE5DC;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 20px;
            }
            .header {
                padding: 30px 20px;
                text-align: center;
            }
            .main-title {
                font-size: 2rem;
            }
            body {
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>

    </div>

</body>
