<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60313 - 綠色旅行・嘉義公園</title>
    <style>
        :root {
            --primary-green: #4A6B53;
            --accent-brown: #8D6E63;
            --bg-light: #FAFAFA;
            --text-dark: #333333;
        }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #ffffff;
            border-bottom: 3px solid var(--primary-green);
            padding: 20px;
            text-align: center;
        }
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-green);
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 18px;
            color: var(--accent-brown);
            margin-top: 5px;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .info-block {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            background-color: #F1F5F2;
            border-radius: 6px;
        }
        .address {
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }
        .main-title {
            font-size: 36px;
            font-weight: 900;
            color: #111;
            margin: 20px 0;
            letter-spacing: 4px;
        }
        .content-section {
            font-size: 16px;
            color: #444;
        }
        .content-section p {
            margin-bottom: 15px;
            text-indent: 0;
        }
        .bullet-list {
            list-style-type: none;
            padding-left: 0;
        }
        .bullet-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 12px;
        }
        .bullet-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary-green);
            font-size: 20px;
            top: -2px;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #888;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">綠色旅行</div>
        <div class="subtitle">散步 / 腳踏車</div>
    </header>

    <div class="container">
        <div class="info-block">
            <div class="address">📍 600嘉義市東區東川里啟明路264號</div>
            <div class="main-title">嘉義公園</div>
        </div>

        <div class="content-section">
            <p>嘉義公園是嘉義市著名的休閒景點：</p>
            <ul class="bullet-list">
                <li>園內的「大球」是具有特色的地標之一，造型醒目，吸引不少遊客前來觀賞與拍照。</li>
                <li>公園綠樹成蔭、環境清幽，適合散步、運動及親子出遊。來到嘉義公園，除了欣賞大球，也能感受自然景觀與城市文化交織的魅力，是認識嘉義、享受悠閒時光的好地方。</li>
                <li>如果你說的是 KANO 園區的「大球」，它是一顆大型棒球造景，象徵嘉義深厚的棒球文化，也呼應嘉義農林棒球隊（KANO）在 1931 年勇闖日本甲子園、獲得亞軍的歷史。</li>
            </ul>
        </div>
    </div>

    <footer>
        網頁編號：60313 | 綠色旅行導覽
    </footer>

</body>
</html>
