<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60301</title>
    <style>
        :root {
            --bg-color: #fcfbfa;
            --text-dark: #2c2c2c;
            --text-muted: #555555;
            --accent-brown: #8a7355;
            --accent-teal: #3b7a7a;
            --accent-coral: #b05c55;
            --accent-dark: #1e252b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang TC", "Helvetica Neue", Helvetica, Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.8;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 50px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 50px;
            position: relative;
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                padding: 30px;
                gap: 40px;
            }
        }

        /* Left Column: Header and Illustration */
        .left-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main-title-area {
            margin-bottom: 40px;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 300;
            color: var(--accent-brown);
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #777;
            letter-spacing: 2px;
        }

        /* Abstract Architectural Illustration using CSS */
        .illustration-container {
            position: relative;
            width: 100%;
            height: 380px;
            margin-top: auto;
        }

        .layer {
            position: absolute;
            width: 100%;
            transform-origin: bottom left;
        }

        /* Dynamic layered polygon approximation from the image */
        .layer-1 {
            bottom: 0; left: 0; width: 100%; height: 160px;
            background-color: var(--accent-teal);
            clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 100%);
            opacity: 0.9;
            z-index: 5;
        }
        
        .layer-1-dark {
            bottom: 0; left: 0; width: 35%; height: 110px;
            background-color: #1a4040;
            clip-path: polygon(0 20%, 100% 0, 100% 100%, 0 100%);
            z-index: 6;
        }

        .layer-2 {
            bottom: 110px; left: 5%; width: 90%; height: 70px;
            background-color: var(--accent-coral);
            clip-path: polygon(0 30%, 100% 0, 95% 100%, 0% 100%);
            z-index: 4;
        }

        .layer-3 {
            bottom: 150px; left: 10%; width: 85%; height: 90px;
            background-color: #dedede;
            border-bottom: 12px solid #555;
            clip-path: polygon(0 40%, 100% 10%, 90% 100%, 5% 100%);
            z-index: 3;
        }

        .layer-4 {
            bottom: 210px; left: 15%; width: 70%; height: 100px;
            background-color: var(--accent-dark);
            clip-path: polygon(0 20%, 90% 0, 100% 100%, 5% 100%);
            z-index: 2;
        }
        
        .layer-base {
            bottom: 40px; left: 20%; width: 50%; height: 80px;
            background-color: #eaeaea;
            border-left: 15px solid #ccc;
            z-index: 5;
        }

        /* Right Column: Info, QR, and Branding Text */
        .right-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .meta-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
        }

        .qr-placeholder {
            width: 90px;
            height: 90px;
            background: #222;
            padding: 6px;
            border-radius: 4px;
            display: flex;
            flex-wrap: wrap;
            position: relative;
        }
        
        /* Simulated QR code aesthetic */
        .qr-placeholder::before {
            content: "";
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            background: linear-gradient(45deg, #fff 25%, transparent 25%),
                        linear-gradient(-45deg, #fff 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #fff 75%),
                        linear-gradient(-45deg, transparent 75%, #fff 75%);
            background-size: 8px 8px;
            background-color: #000;
        }

        .address-box {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .brand-title {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--text-dark);
            line-height: 1.2;
            margin-bottom: 25px;
            letter-spacing: 2px;
            position: relative;
        }

        .brand-description {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-align: justify;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Column -->
        <div class="left-col">
            <div class="main-title-area">
                <h1 class="main-title">綠色旅行</h1>
                <div class="subtitle">散步／腳踏車</div>
            </div>
            
            <div class="illustration-container">
                <div class="layer layer-4"></div>
                <div class="layer layer-3"></div>
                <div class="layer layer-2"></div>
                <div class="layer layer-1"></div>
                <div class="layer layer-1-dark"></div>
                <div class="layer layer-base"></div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="right-col">
            <div class="meta-section">
                <div class="qr-placeholder"></div>
                <div class="address-box">
                    600嘉義市東區義教里忠孝路600號
                </div>
            </div>

            <h2 class="brand-title">耐斯 其斯</h2>

            <p class="brand-description">耐斯是一間充滿熱情與溫度的店，秉持著用
心經營、顧客至上的理念，希望為每一位顧客帶來舒適、愉快
的消費體驗。我們重視每一個細節，從服務品質到顧客需求，都
以認真負責的態度用心對待，無論是初次來訪的新朋友，還是長
期支持的老顧客，耐斯都希望讓每個人感受到親切、安心與滿滿
的誠意。我們相信，好的店家不只是提供商品或服務，更重要的
是建立信任與情感連結。未來，耐斯將持續努力提升品質、精進
服務，以真誠的心對待每一位顧客，打造值得信賴、令人喜愛的
品牌，讓每一次相遇都成為美好的回憶。</p>
        </div>
    </div>

</body>
</html>
