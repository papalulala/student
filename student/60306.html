<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60323</title>
    <style>
        :root {
            --primary-color: #2b5c43;
            --text-color: #333333;
            --bg-color: #fcfbfa;
            --card-bg: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 50px;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 50px;
            position: relative;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                padding: 30px 20px;
                gap: 40px;
            }
        }

        /* Left Column: Header and Illustration */
        .left-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main-title-box {
            margin-bottom: 40px;
        }

        .main-title {
            font-size: 3.5rem;
            font-weight: 300;
            color: var(--primary-color);
            letter-spacing: 4px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #666;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Illustration Style for Cat's Tail Storefront */
        .illustration-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #f5f5f5;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            margin-top: auto;
        }

        .building-base {
            position: absolute;
            bottom: 15%;
            left: 15%;
            width: 70%;
            height: 55%;
            background: #4a545e;
            border: 2px solid #333;
        }

        .building-roof {
            position: absolute;
            bottom: 70%;
            left: 13%;
            width: 74%;
            height: 4%;
            background: #7a848e;
        }

        .window-frame {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            background: #ffffff;
            border: 3px solid #333;
            display: flex;
        }

        .window-pane-left {
            width: 50%;
            height: 100%;
            background: #2a3c50;
            border-right: 2px solid #333;
        }

        .window-pane-right {
            width: 50%;
            height: 100%;
            background: #152232;
            position: relative;
        }

        .abstract-accent-1 {
            position: absolute;
            left: -20px;
            top: -10px;
            width: 40px;
            height: 120%;
            background: #2c3e6b;
            transform: rotate(-5deg);
            opacity: 0.8;
        }

        .abstract-accent-2 {
            position: absolute;
            right: -15px;
            bottom: -5px;
            width: 30px;
            height: 100%;
            background: #8b3a3a;
            transform: rotate(3deg);
        }

        .abstract-line {
            position: absolute;
            right: 15%;
            bottom: 15%;
            width: 25%;
            height: 40%;
            border-left: 3px solid #c0392b;
            border-bottom: 3px solid #c0392b;
            transform: skewX(-10deg);
        }

        /* Right Column: Info and Story */
        .right-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
        }

        .qr-address-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 35px;
        }

        .qr-code {
            width: 120px;
            height: 120px;
            background: #333;
            padding: 8px;
            border-radius: 4px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 4px;
        }

        /* Fake QR bits for clean stylized look */
        .qr-code div { background: #fff; }
        .qr-code div:nth-child(2n), .qr-code div:nth-child(3n+1) { background: #333; }
        .qr-code .corner { background: #fff; border: 4px solid #333; }

        .address {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #666;
            letter-spacing: 1px;
            text-align: center;
        }

        .spot-name-box {
            margin-bottom: 30px;
            width: 100%;
        }

        .spot-name {
            font-size: 4rem;
            font-weight: 900;
            color: #222;
            letter-spacing: 6px;
            line-height: 1.1;
            font-family: "Buriko", "Arial Black", sans-serif;
            position: relative;
        }

        .story-text {
            font-size: 1.05rem;
            color: #444;
            text-align: justify;
            letter-spacing: 0.5px;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Section -->
        <div class="left-col">
            <div class="main-title-box">
                <h1 class="main-title">綠色旅行</h1>
                <div class="subtitle">散步／腳踏車</div>
            </div>
            
            <div class="illustration-container">
                <div class="abstract-accent-1"></div>
                <div class="building-base">
                    <div class="window-frame">
                        <div class="window-pane-left"></div>
                        <div class="window-pane-right">
                            <div class="abstract-line"></div>
                        </div>
                    </div>
                </div>
                <div class="building-roof"></div>
                <div class="abstract-accent-2"></div>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-col">
            <div class="qr-address-box">
                <div class="qr-code">
                    <div class="corner"></div><div></div><div></div><div class="corner"></div>
                    <div></div><div></div><div></div><div></div>
                    <div></div><div></div><div></div><div></div>
                    <div class="corner"></div><div></div><div></div><div class="corner"></div>
                </div>
                <div class="address">600嘉義市東區朝陽里民族路25號</div>
            </div>

            <div class="spot-name-box">
                <h2 class="spot-name">貓尾巴</h2>
            </div>

            <p class="story-text">
                貓尾巴以溫暖療癒的氛圍，將對甜點的熱愛融入每一份手作之中。用心挑選食材，細心製作每一道甜點，讓香甜滋味成為生活中的小確幸。無論是日常的小小犒賞，還是節日裡的重要時刻，都希望透過甜點傳遞幸福與心意，讓每一次品嚐，都像遇見貓咪般溫柔又令人心動。
            </p>
        </div>
    </div>

</body>
</html>
