<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠色旅行 - 初八麵食</title>
    <style>
        :root {
            --bg-color: #fcfbfa;
            --text-main: #333333;
            --text-muted: #666666;
            --primary-accent: #7a5c43;
            --green-title: #738f6b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            padding: 50px;
            position: relative;
            overflow: hidden;
        }

        /* Top Header Area */
        .header {
            margin-bottom: 40px;
        }
        
        .main-title {
            font-size: 42px;
            color: var(--green-title);
            font-weight: 500;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .sub-title {
            font-size: 18px;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* Content Layout Split */
        .content-grid {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 50px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 30px 20px;
            }
        }

        /* Left Side Illustration (Pure CSS Artwork) */
        .illustration-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .artwork {
            position: relative;
            width: 440px;
            height: 250px;
            background: transparent;
        }

        /* Building base layers */
        .art-roof-top {
            position: absolute;
            top: 20px;
            left: 10px;
            width: 410px;
            height: 35px;
            background: #6e585a; /* Deep reddish brown */
            border-radius: 4px 12px 2px 2px;
            transform: skewX(-5deg);
        }

        .art-roof-accent {
            position: absolute;
            top: 25px;
            right: 35px;
            width: 50px;
            height: 25px;
            background: #e08b73; /* Peach accent polygon on roof */
            clip-path: polygon(30% 0%, 100% 40%, 80% 100%, 0% 70%);
        }

        .art-roof-shadow {
            position: absolute;
            top: 55px;
            left: 12px;
            width: 405px;
            height: 20px;
            background: #2b2625; /* Dark brown trim */
        }

        .art-main-wall {
            position: absolute;
            top: 75px;
            left: 15px;
            width: 400px;
            height: 150px;
            background: #cdc5b4; /* Muted tan wall base */
            display: flex;
        }

        /* Splitting the wall colors and patterns */
        .art-left-wall {
            position: absolute;
            top: 75px;
            left: 15px;
            width: 230px;
            height: 150px;
            background: #c3baa5;
            border-right: 4px solid #948b78;
        }

        .art-right-wall {
            position: absolute;
            top: 75px;
            left: 245px;
            width: 170px;
            height: 150px;
            background: #ded7c9;
        }

        /* Abstract shapes inside the illustration */
        .art-window-left {
            position: absolute;
            top: 105px;
            left: 35px;
            width: 75px;
            height: 45px;
            background: #ffffff;
            border: 3px solid #8c8270;
            box-shadow: inset 0 0 0 4px #cdc5b4, -8px 0 0 #a39987;
        }

        .art-tree-shadow {
            position: absolute;
            top: 110px;
            left: 150px;
            width: 45px;
            height: 90px;
            background: #a89d87;
            clip-path: polygon(50% 0%, 100% 40%, 75% 40%, 85% 100%, 15% 100%, 25% 40%, 0% 40%);
        }

        .art-door-right {
            position: absolute;
            top: 115px;
            left: 275px;
            width: 55px;
            height: 75px;
            background: #ffffff;
            border: 4px solid #914436;
        }

        .art-door-inset {
            position: absolute;
            top: 130px;
            left: 290px;
            width: 20px;
            height: 25px;
            background: #3a3230;
        }

        .art-red-panel {
            position: absolute;
            top: 100px;
            left: 345px;
            width: 55px;
            height: 50px;
            background: #b85c4c;
            border: 3px solid #ffffff;
        }

        .art-right-shadow {
            position: absolute;
            top: 110px;
            left: 385px;
            width: 30px;
            height: 100px;
            background: #876953;
            clip-path: polygon(30% 0%, 80% 20%, 50% 80%, 100% 100%, 10% 90%);
            opacity: 0.8;
        }

        /* Right Side Content Info */
        .info-panel {
            display: flex;
            flex-direction: column;
        }

        .qr-address-block {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .qr-mock {
            width: 75px;
            height: 75px;
            background: #fff;
            border: 2px solid #333;
            padding: 4px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
        }
        .qr-box { background: #333; }
        .qr-box:nth-child(2), .qr-box:nth-child(6), .qr-box:nth-child(7) { background: transparent; }

        .address-text {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .brand-title {
            font-size: 48px;
            font-weight: 700;
            color: #111111;
            margin-bottom: 25px;
            letter-spacing: 3px;
            position: relative;
        }

        .brand-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--primary-accent);
            margin-top: 10px;
        }

        .description {
            font-size: 15px;
            color: #444444;
            text-align: justify;
            margin-bottom: 35px;
        }

        /* Google Map Section */
        .map-section {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .map-section iframe {
            width: 100%;
            height: 250px;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top header common to the guide series -->
        <div class="header">
            <h1 class="main-title">綠色旅行</h1>
            <div class="sub-title">散步／腳踏車</div>
        </div>

        <div class="content-grid">
            <!-- Left Side: Digital Geometric Illustration -->
            <div class="illustration-container">
                <div class="artwork">
                    <div class="art-roof-top"></div>
                    <div class="art-roof-accent"></div>
                    <div class="art-roof-shadow"></div>
                    <div class="art-left-wall"></div>
                    <div class="art-right-wall"></div>
                    <div class="art-window-left"></div>
                    <div class="art-tree-shadow"></div>
                    <div class="art-door-right"></div>
                    <div class="art-door-inset"></div>
                    <div class="art-red-panel"></div>
                    <div class="art-right-shadow"></div>
                </div>
            </div>

            <!-- Right Side: Content Details & Map -->
            <div class="info-panel">
                <div class="qr-address-block">
                    <div class="qr-mock">
                        <div class="qr-box"></div><div class="qr-box"></div><div class="qr-box"></div>
                        <div class="qr-box"></div><div class="qr-box"></div><div class="qr-box"></div>
                        <div class="qr-box"></div><div class="qr-box"></div><div class="qr-box"></div>
                    </div>
                    <div class="address-text">600009嘉義市東區中山里安樂街188號</div>
                </div>

                <h2 class="brand-title">初八麵食</h2>

                <p class="description">
                    初八麵食堂初八麵食堂以美味、實在、用心為理念，提供多樣化的麵食料理。嚴選食材、講究湯頭與口感，讓每一碗麵都充滿家的溫度。無論是日常用餐、朋友聚餐，還是簡單享受一頓美食，都能在初八找到滿足與幸福。歡迎來到初八麵食堂，品嚐一碗熱騰騰的好麵！
                </p>

                <!-- Embedded interactive Google Map navigation -->
                <div class="map-section">
                    <iframe 
                        src="https://maps.google.com/maps?q=600%E5%98%89%E7%BE%A9%E5%B8%82%E6%9D%B1%E5%8D%A0%E4%B8%AD%E5%B1%B1%E9%87%8C%E5%AE%89%E6%A8%82%E8%A1%97188%E8%99%9F&t=&z=16&ie=UTF-8&iwloc=&output=embed" 
                        allowfullscreen="" 
                        loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
