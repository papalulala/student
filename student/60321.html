<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠色旅行 - 檜意森活村</title>
    <style>
        :root {
            --primary-color: #4A6741;
            --primary-light: #8FBC8F;
            --text-dark: #2F3E2B;
            --text-light: #6B7C65;
            --bg-light: #F4F7F2;
            --card-bg: #FFFFFF;
            --accent-brown: #8B5A2B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang TC", "Helvetica Neue", Helvetica, Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.8;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(74, 103, 65, 0.1);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            body {
                padding: 10px;
            }
        }

        /* 左側視覺圖形區塊 */
        .visual-section {
            background: linear-gradient(135deg, #E6EFF2 0%, #CDDFE6 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            min-height: 500px;
        }

        .series-title {
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--primary-color);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .series-subtitle {
            font-size: 1.1rem;
            color: var(--text-light);
            letter-spacing: 4px;
            margin-bottom: 30px;
        }

        /* CSS繪製檜意森活村插畫 */
        .illustration-container {
            width: 100%;
            height: 350px;
            position: relative;
            background: #D5E4EB;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        .sky-cloud {
            position: absolute;
            background: #FFFFFF;
            opacity: 0.7;
        }
        .cloud-1 { top: 20px; left: 10%; width: 120px; height: 30px; border-radius: 15px; clip-path: polygon(0% 50%, 30% 20%, 70% 10%, 100% 60%, 80% 90%, 20% 90%); }
        .cloud-2 { top: 40px; right: 15%; width: 160px; height: 40px; border-radius: 20px; clip-path: polygon(10% 60%, 40% 20%, 80% 30%, 100% 70%, 70% 95%, 30% 90%); }

        .mountain-back {
            position: absolute;
            bottom: 60px;
            left: -20px;
            width: 120%;
            height: 180px;
            background: #9BB3C4;
            clip-path: polygon(0% 80%, 15% 40%, 35% 65%, 55% 20%, 75% 50%, 90% 15%, 100% 40%, 100% 100%, 0% 100%);
        }

        .tree-tall {
            position: absolute;
            bottom: 40px;
            left: 10%;
            width: 70px;
            height: 220px;
            background: #5E5043;
            clip-path: polygon(40% 0%, 60% 0%, 75% 10%, 70% 40%, 85% 60%, 65% 90%, 60% 100%, 40% 100%, 35% 85%, 20% 65%, 35% 40%);
        }

        .village-roofs {
            position: absolute;
            bottom: 40px;
            right: 5%;
            width: 75%;
            height: 120px;
            background: #232D30;
            clip-path: polygon(0% 100%, 10% 50%, 25% 65%, 45% 40%, 65% 60%, 85% 35%, 100% 55%, 100% 100%);
        }

        .village-wall {
            position: absolute;
            bottom: 40px;
            right: 8%;
            width: 70%;
            height: 50px;
            background: #D9D2C9;
            clip-path: polygon(5% 0%, 20% 20%, 40% 0%, 65% 15%, 95% 0%, 100% 100%, 0% 100%);
        }

        .ground-green {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #3B4A34;
            clip-path: polygon(0% 60%, 25% 40%, 60% 70%, 100% 50%, 100% 100%, 0% 100%);
        }
        
        .ground-light {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: #738469;
            clip-path: polygon(0% 50%, 35% 30%, 75% 60%, 100% 40%, 100% 100%, 0% 100%);
        }

        /* 右側內容區塊 */
        .content-section {
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-meta {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 2px dashed #E2EADF;
            padding-bottom: 25px;
        }

        .address-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .address-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
            font-weight: bold;
        }

        .address-text {
            font-size: 1.05rem;
            color: var(--text-dark);
            font-weight: 500;
        }

        .qr-code-wrapper {
            text-align: center;
            flex-shrink: 0;
        }

        .qr-code {
            width: 75px;
            height: 75px;
            background: #222;
            padding: 5px;
            border-radius: 6px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 3px;
        }

        .qr-block { background: #fff; }
        .qr-block.b { background: #222; }

        .main-title {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 25px;
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
        }

        .main-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 60px;
            height: 4px;
            background-color: var(--accent-brown);
            border-radius: 2px;
        }

        .description-text {
            font-size: 1.05rem;
            color: #455240;
            text-align: justify;
            margin-bottom: 35px;
            text-indent: 2em;
        }

        /* 地圖導航區塊 */
        .map-section {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border: 1px solid #E2EADF;
        }

        .map-section iframe {
            width: 100%;
            height: 250px;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 左側：手冊視覺與繪圖 -->
        <div class="visual-section">
            <div>
                <h1 class="series-title">綠色旅行</h1>
                <p class="series-subtitle">散步 ∕ 腳踏車</p>
            </div>
            
            <div class="illustration-container">
                <div class="sky-cloud cloud-1"></div>
                <div class="sky-cloud cloud-2"></div>
                <div class="mountain-back"></div>
                <div class="tree-tall"></div>
                <div class="village-roofs"></div>
                <div class="village-wall"></div>
                <div class="ground-green"></div>
                <div class="ground-light"></div>
            </div>
        </div>

        <!-- 右側：文字內容、資訊與導航 -->
        <div class="content-section">
            <div>
                <div class="header-meta">
                    <div class="address-box">
                        <span class="address-label">LOCATION</span>
                        <span class="address-text">600嘉義市東區林森里共和路356巷3號</span>
                    </div>
                    <div class="qr-code-wrapper">
                        <!-- 模擬手冊QR碼樣式 -->
                        <div class="qr-code">
                            <div class="qr-block b"></div><div class="qr-block b"></div><div class="qr-block"></div><div class="qr-block b"></div><div class="qr-block b"></div>
                            <div class="qr-block b"></div><div class="qr-block"></div><div class="qr-block b"></div><div class="qr-block"></div><div class="qr-block b"></div>
                            <div class="qr-block"></div><div class="qr-block b"></div><div class="qr-block b"></div><div class="qr-block b"></div><div class="qr-block"></div>
                            <div class="qr-block b"></div><div class="qr-block"></div><div class="qr-block b"></div><div class="qr-block"></div><div class="qr-block b"></div>
                            <div class="qr-block b"></div><div class="qr-block b"></div><div class="qr-block"></div><div class="qr-block b"></div><div class="qr-block b"></div>
                        </div>
                    </div>
                </div>

                <h2 class="main-title">檜意森活村</h2>
                <p class="description-text">
                    嘉義市的檜意森活村，是一處融合歷史文化、日式建築與文創藝術的特色景點。園區內保留了日治時期的檜木宿舍群，古色古香的木造建築展現了濃厚的日式風情。漫步其中，不僅能感受昔日林業發展的歷史氛圍，還能欣賞文創商品、品嚐特色美食及體驗在地文化。檜意森活村不只是觀光景點，更是連結嘉義林業歷史與現代生活的重要文化空間，吸引許多遊客前來探索與拍照留念。
                </p>
            </div>

            <!-- Google 地圖區塊 -->
            <div class="map-section">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3659.8329606821863!2d120.45209797607736!3d23.48452399878235!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346e943260000001%3A0x7df6b0934dd278db!2z檜意森活村 Hinoki Village!5e0!3m2!1szh-TW!2stw!4v1710000000000!5m2!1szh-TW!2stw" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </div>

</body>
</html>
