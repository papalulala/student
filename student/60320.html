    <header>

        <p>綠色旅行 ｜ 散步 ． 腳踏車</p>

    <div class="container">
        <div class="main-card">
            <div class="tagline">檜意森活村</div>
            <div class="content-text">
                檜意森活村位於嘉義市，是一處融合日式建築、歷史文化與文創特色的觀光園區。
                園區保留日式木造建築與懷舊街景，漫步其中，彷彿穿越時光，感受濃厚的日式風情。
                這裡匯集特色商店、文創商品與在地美食，適合拍照打卡、休閒散步及體驗嘉義的人文魅力，是來到嘉義旅遊不可錯過的特色景點。
            </div>

            <div class="info-grid">
                <div class="info-box">

                    <p>600嘉義市東區林森東路356巷3號</p>
                </div>
                <div class="info-box">
                    <h3>🚲 推薦玩法</h3>
                    <p>適合慢活散步、悠閒騎腳踏車，深度體驗日式建築群的歷史與人文氣息。</p>
